name: pages

# Publishes web/ui as a static site. Without an engine to talk to, the UI
# runs its built-in demo simulator, so the live demo needs no server.
on:
  push:
    branches: [main]
    paths: [web/ui/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/ui
      - id: deployment
        uses: actions/deploy-pages@v4
