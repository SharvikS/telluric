name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -count=1 ./...
      - name: Build static binaries
        run: |
          for arch in amd64 arm64; do
            make clean
            GOARCH=$arch make build
            dir=telluric-${GITHUB_REF_NAME}-linux-$arch
            mkdir -p dist/$dir
            cp bin/telluric bin/telluric-capture README.md LICENSE dist/$dir/
            tar -C dist -czf dist/$dir.tar.gz $dir
          done
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS \
            --title "Telluric $GITHUB_REF_NAME" --generate-notes
